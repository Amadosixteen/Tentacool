name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es la del entorno de referencia; 3.11 se prueba porque es la
        # que trae Ubuntu 22.04 / Debian 12 y mucha gente clonará con esa.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        # Sin .env: los tests no deben depender de credenciales ni de la
        # configuración de quien los corra. Si alguno empieza a necesitarlas,
        # es el test el que está mal.
        run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Sin dependencias externas no hay go.sum, y la caché por defecto
          # lo exige y falla.
          cache: false

      - name: Compilar
        working-directory: tentacool-io
        run: go build ./...

      - name: Vet
        working-directory: tentacool-io
        run: go vet ./...
